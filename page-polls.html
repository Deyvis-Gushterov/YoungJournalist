<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Анкети — Млад журналист</title><link rel="stylesheet" href="css-style.css"><link rel="stylesheet" href="css-complete-redesign.css"><style>.polls-page{max-width:1000px;margin:70px auto;padding:24px}.polls-page>h1{font:800 clamp(2.2rem,5vw,4rem) 'Playfair Display',serif;color:#151d32}.poll-list{display:grid;gap:24px}.poll-card{background:#fffdfa;border:1px solid #ded6c8;border-radius:16px;padding:30px;box-shadow:0 12px 35px #1717170d}.poll-card h2{font:700 clamp(1.35rem,3vw,2rem) 'Playfair Display',serif;margin:0 0 20px}.poll-options{display:grid;gap:10px}.poll-option{display:block;text-align:left;width:100%;padding:16px 18px;border:1px solid #ded6c8;border-radius:10px;background:#fff;color:#151d32;font-weight:700;cursor:pointer}.poll-option:hover{border-color:#d94f45;background:#fff8f5}.poll-result{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:12px;padding:15px;border:1px solid #ded6c8;border-radius:9px}.poll-bar{position:absolute;inset:0 auto 0 0;background:#f3deda;z-index:0}.poll-label,.poll-pct{position:relative;z-index:1}.poll-note{margin:16px 0 0;color:#70685e}.poll-meta{font-size:.85rem;color:#82796c;margin-bottom:14px}@media(max-width:600px){.polls-page{margin:30px auto;padding:16px}.poll-card{padding:20px}}</style></head><body><main class="polls-page"><p class="eyebrow">МЛАД ЖУРНАЛИСТ / УЧАСТВАЙ</p><h1>Анкети</h1><p>Твоето мнение има значение. Гласувай в активните анкети.</p><div id="pollList" class="poll-list"><p>Зареждане…</p></div><p><a href="index.html">← Към началната страница</a></p></main><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="js-auth-firebase-config.js"></script><script src="js-polls-core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>window.YJPolls&&window.YJPolls.renderList('pollList'));</script></body></html>
