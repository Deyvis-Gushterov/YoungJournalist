</head><body><main class="safe-admin-notice"><p class="eyebrow">СИГУРНОСТ НА САЙТА</p><h1>Администраторски достъп</h1><p>Създаването на администратор през публична уеб страница е изключено. Всеки посетител би могъл да си даде администраторски права, ако тази функция остане активна.</p><ol><li>Създайте потребител през стандартната регистрация.</li><li>Отворете Firebase Console → Realtime Database → <code>users/USER_UID</code>.</li><li>Задайте <code>role: "admin"</code> само за доверения акаунт.</li><li>Проверете правилата за сигурност от <code>firebase-database.rules.json</code> преди публикуване.</li></ol><a href="index.html">← Към вестника</a></main></body></html>
